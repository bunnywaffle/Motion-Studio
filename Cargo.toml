[workspace]
resolver = "2"
members = [
    "crates/application",
    "crates/project",
    "crates/compositor",
]
exclude = [
    "flux-files-gpui",
    "tetris",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.6.1"
project = { path = "crates/project" }
compositor = { path = "crates/compositor" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

