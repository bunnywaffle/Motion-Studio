[workspace]
resolver = "2"
members = [
    "crates/application",
    "crates/project",
    "crates/compositor",
    "crates/renderer",
]
exclude = [
    "flux-files-gpui",
    "tetris",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.6.1"
project = { path = "crates/project" }
compositor = { path = "crates/compositor" }
renderer = { path = "crates/renderer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = "24.0"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
thiserror = "2.0"

